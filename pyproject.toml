[project]
name = "ansible-gcp-janitor"
version = "0.2.0"
description = "HTTP-triggered GCP Cloud Function (2nd Gen) that finds and deletes leftover GCP resources from Ansible integration tests"
requires-python = ">=3.11"
authors = [
    { name = "Ansible GCP Janitor Contributors" }
]
dependencies = [
    "functions-framework==3.*",
    "google-api-python-client==2.*",
    "google-auth-httplib2==0.*",
    "google-cloud-aiplatform==1.*",
    "google-cloud-alloydb==0.*",
    "google-cloud-bigquery==3.*",
    "google-cloud-build==3.*",
    "google-cloud-compute==1.*",
    "google-cloud-pubsub==2.*",
    "google-cloud-resource-manager==1.*",
    "google-cloud-storage==3.*",
    "httplib2==0.*",
]

[project.optional-dependencies]
dev = [
    "pytest==8.*",
    "pytest-cov==5.*",
    "pytest-mock==3.*",
]

[tool.uv]
managed = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: All Unit tests",
    "handler: Handler Unit tests",
]

[tool.coverage.run]
source = ["janitor", "main"]
omit = ["*/__pycache__/*", "*.pyc"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
